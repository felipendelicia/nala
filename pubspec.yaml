name: apuntes
description: Cuadernos y PDFs para estudiar con S Pen.
publish_to: none
version: 0.5.1+6
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sqlite3: 3.7.0
  pdfrx: 2.6.5
  pdfrx_engine: 0.6.1
  pdf: 3.13.1
  image: 4.10.1
  google_sign_in: 7.2.0
  oauth2: 2.0.5
  flutter_secure_storage: 11.2.0
  file_selector: 1.1.0
  http: ^1.6.0
  crypto: ^3.0.7
  uuid: ^4.5.2
  path: ^1.9.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  vector_math: ^2.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
  assets:
    - assets/nala-icon.png
    - assets/fonts/NalaSans.ttf
    - assets/fonts/LICENSE-Manrope.txt
    - assets/fonts/FONTLOG-Manrope.txt
    - assets/fonts/LICENSE-DejaVu.txt
flutter_launcher_icons:
  android: true
  image_path: assets/nala-icon.png
  min_sdk_android: 24
