services:
  nala:
    build: .
    user: "10001:10001"
    init: true
    read_only: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NALA_HOST_PORT:-8080}:8080"
    volumes:
      - nala-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  nala-data:
